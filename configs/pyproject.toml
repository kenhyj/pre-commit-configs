[tool.black]
line-length = 150 # make sure that this is consistent with the max lenght in pylintrc
target-version = ['py310'] 
include = '\.pyi?$'
#extend-exclude excludes files or directories in addition to the defaults
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directoreis
# in the root of the project.
(
    ^/foo.py # exclude a file named foo.py in the root of the project
    | .*_pb2.py 3 exclude autogenerate protocol Buffer files anywhere in the project
)
'''